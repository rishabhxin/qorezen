<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin Group</title>
<link rel="shortcut icon" href="/Origin Group.png" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#000;
    --text:#fff;
    --accent:#FF6B35;
    --secondary:#4F46E5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* Header */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    padding:25px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:.4s ease;
}

header.scrolled{
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo img{
    height:70px;
    width:auto;
    object-fit:contain;
    transition:0.3s ease;
}

.logo img:hover{
    transform:scale(1.05);
}

/* Hero */

.hero{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.hero video{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
}


.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:800px;
    padding:20px;
    animation:fadeUp 1.2s ease;
}

.hero-content h1{
    font-size:4rem;
    margin-bottom:20px;
    line-height:1.1;
}

.hero-content p{
    font-size:1.1rem;
    opacity:.9;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    border-radius:50px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--secondary));
    transition:.4s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(255,107,53,.35);
}

/* Footer */

footer{
    background:#050505;
    padding:30px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.1);
}

.footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:15px;
}

.footer-links a{
    color:#fff;
    text-decoration:none;
    opacity:.8;
}

.footer-links a:hover{
    color:var(--accent);
}

.socials{
    margin-bottom:15px;
}

.socials a{
    color:#fff;
    text-decoration:none;
    margin:0 10px;
    font-size:1.2rem;
}

.socials a:hover{
    color:var(--accent);
}

/* Animations */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    .hero-content h1{
        font-size:2.5rem;
    }

    nav ul{
        gap:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    header{
        padding:20px;
    }
}
</style>
</head>
<body>

<header id="header">
    <div class="logo">
    <img src="/Origin Group.png" alt="Origin Group Logo">
</div>

</header>

<section class="hero">

    <video autoplay loop playsinline>
        <source src="/we create moments.mp4" type="video/mp4">
    </video>


</section>

<footer>

    <div class="socials">
        <a href="https://www.instagram.com/origingroupin/" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/showcase/origingroupin/" target="_blank">LinkedIn</a>
    </div>

    <p>© 2026 Origin Group. All Rights Reserved.</p>
</footer>

<script>
window.addEventListener("scroll", () => {
    const header = document.getElementById("header");
    if(window.scrollY > 50){
        header.classList.add("scrolled");
    } else {
        header.classList.remove("scrolled");
    }
});
</script>

</body>
</html>
